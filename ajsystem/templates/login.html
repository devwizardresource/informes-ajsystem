{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block content %}
<div class="login-wrap">
  <section class="login">
    <div class="login-head"><img src="{{ url_for('static', filename='img/logo-aj-system@2x.png') }}?v={{ static_version }}" alt="AJ System" width="157" height="64"></div>
    <h1>Iniciar sesión</h1>
    <form method="post" action="{{ url_for('auth.login') }}" data-busy>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" name="next" value="{{ next }}">
      <label for="username">Usuario o número de identificación</label>
      <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required maxlength="64" value="{{ username or '' }}" autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" data-reveal-password required maxlength="256">
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
  </section>
</div>
{% endblock %}
